# Deterministic mixing-fraction inversion (candidate-pool synthetic search).
#
# - Randomly sample a candidate pool from root_dir
# - Select synthetic_pairs random unique pairs as hidden ground truth
# - Synthesize C from the clean A/B pair
# - Recover the best pair + x_hat using noisy templates (optional)
data:
  mode: candidate_pool_synthetic
  candidate_pool:
    root_dir: data/raw/Double Pattern Data/Good Pattern
    recursive: false
    max_candidates: 12
    sample_seed: null
    synthetic_pairs: 3
    synthetic_seed: null
    x_true: [0.2, 0.5, 0.8]
    noise:
      enabled: true
      gaussian_std: 0.01
      rotation_deg_max: 2.0
      seed: null

deterministic_inversion:
  preprocess:
    auto_crop_to_target: false
    mask:
      enabled: true
      detect_existing: true
      zero_tolerance: 0.0005
      outside_zero_fraction: 0.98
    background_correction:
      enabled: true
      mode: subtractive
      sigma: 21.0
      epsilon: 1.0e-6
    standardize:
      enabled: true
      epsilon: 1.0e-6
    dog:
      enabled: false
      sigma_low: 1.0
      sigma_high: 3.0
    fft_filter:
      enabled: false
      low_cut: 0.0
      high_cut: 1.0
      rolloff: 0.02
  metrics:
    enabled: ["ncc", "ssim", "l2", "l1"]
    primary: ncc
  search:
    strategy: exhaustive_grid
    grid_steps: [0.05, 0.01, 0.002]
    refine_window_steps: 4
    exhaustive_step: 0.002
  alignment:
    enabled: false
    translation:
      enabled: true
      max_shift_px: 15
    rotation:
      enabled: true
      search_range_deg: 2.0
      hard_max_deg: 5.0
      step_deg: 0.5
    interpolation_order: 3

output:
  out_dir: outputs/deterministic_inversion_candidate_pool
  save_curves: true
  write_html_report: true

debug:
  enabled: false
  seed: 42
  sample_limit: null
  max_pairs: null
