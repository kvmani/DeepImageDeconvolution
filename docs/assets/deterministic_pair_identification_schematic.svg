<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1300" viewBox="0 0 2000 1300">
  <defs>
    <style>
      .title { font: 700 38px Arial, Helvetica, sans-serif; fill: #111827; }
      .subtitle { font: 500 22px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .eq { font: 500 24px "Courier New", Courier, monospace; fill: #111827; }
      .boxTitle { font: 700 24px Arial, Helvetica, sans-serif; fill: #111827; }
      .boxText { font: 500 20px Arial, Helvetica, sans-serif; fill: #1f2937; }
      .smallText { font: 500 18px Arial, Helvetica, sans-serif; fill: #374151; }
      .tagText { font: 700 18px Arial, Helvetica, sans-serif; fill: #1e3a8a; }
      .stroke { stroke: #334155; stroke-width: 2.4; }
      .arrow { stroke: #334155; stroke-width: 3.2; fill: none; marker-end: url(#arrowHead); }
      .dashArrow { stroke: #475569; stroke-width: 2.6; stroke-dasharray: 10 8; fill: none; marker-end: url(#arrowHeadSmall); }
    </style>
    <marker id="arrowHead" markerWidth="14" markerHeight="10" refX="11" refY="5" orient="auto">
      <polygon points="0,0 14,5 0,10" fill="#334155"/>
    </marker>
    <marker id="arrowHeadSmall" markerWidth="11" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 11,4 0,8" fill="#475569"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="2000" height="1300" fill="#f8fafc"/>

  <text x="1000" y="64" text-anchor="middle" class="title">Deterministic Candidate-Pair Identification from Mixed Pattern C</text>
  <text x="1000" y="104" text-anchor="middle" class="subtitle">Core algorithm (pair discovery + mixing-fraction inversion + optional rigid alignment)</text>
  <text x="1000" y="150" text-anchor="middle" class="eq">C_hat_ij(x) = x P_i + (1 - x) P_j,  x in [0,1]</text>

  <!-- Input: candidate bank -->
  <rect x="90" y="210" rx="20" ry="20" width="470" height="170" fill="#dbeafe" class="stroke"/>
  <text x="325" y="255" text-anchor="middle" class="boxTitle">Candidate Bank</text>
  <text x="325" y="292" text-anchor="middle" class="boxText">{P_k},  k = 1,...,n</text>
  <text x="325" y="328" text-anchor="middle" class="smallText">Candidate pure patterns</text>
  <text x="325" y="355" text-anchor="middle" class="smallText">(unordered pair model: AB == BA)</text>

  <!-- Input: observed C -->
  <rect x="1440" y="210" rx="20" ry="20" width="470" height="170" fill="#dcfce7" class="stroke"/>
  <text x="1675" y="255" text-anchor="middle" class="boxTitle">Observed Input</text>
  <text x="1675" y="292" text-anchor="middle" class="boxText">Mixed pattern C</text>
  <text x="1675" y="328" text-anchor="middle" class="smallText">Unknown contributors A, B</text>
  <text x="1675" y="355" text-anchor="middle" class="smallText">Unknown mixing fraction x</text>

  <!-- Pair set -->
  <rect x="690" y="220" rx="20" ry="20" width="620" height="220" fill="#ede9fe" class="stroke"/>
  <text x="1000" y="265" text-anchor="middle" class="boxTitle">Construct Unique Pair Set</text>
  <text x="1000" y="306" text-anchor="middle" class="eq">U = {(i,j) | 1 &lt;= i &lt; j &lt;= n}</text>
  <text x="1000" y="346" text-anchor="middle" class="eq">|U| = n(n-1)/2</text>
  <text x="1000" y="386" text-anchor="middle" class="smallText">Evaluate only unique unordered candidate pairs</text>
  <text x="1000" y="416" text-anchor="middle" class="smallText">to avoid AB/BA duplication</text>

  <!-- Stage 1 -->
  <rect x="120" y="520" rx="22" ry="22" width="700" height="300" fill="#eff6ff" class="stroke"/>
  <text x="470" y="568" text-anchor="middle" class="boxTitle">Stage-1: Coarse Pair Screening</text>
  <text x="470" y="609" text-anchor="middle" class="boxText">For each (i,j) in U:</text>
  <text x="470" y="650" text-anchor="middle" class="eq">x_ij^coarse = argmax_x NCC(C_hat_ij(x), C)</text>
  <text x="470" y="690" text-anchor="middle" class="smallText">Fast coarse x-grid search</text>
  <text x="470" y="724" text-anchor="middle" class="smallText">Primary score: NCC, Tie-break: minimum L2</text>
  <text x="470" y="758" text-anchor="middle" class="smallText">Output coarse ranking over all pairs</text>
  <rect x="154" y="542" rx="10" ry="10" width="115" height="36" fill="#dbeafe" stroke="#1e40af" stroke-width="1.8"/>
  <text x="212" y="566" text-anchor="middle" class="tagText">ALL PAIRS</text>

  <!-- Shortlist -->
  <rect x="900" y="575" rx="18" ry="18" width="380" height="185" fill="#fef3c7" class="stroke"/>
  <text x="1090" y="621" text-anchor="middle" class="boxTitle">Top-M Shortlist</text>
  <text x="1090" y="661" text-anchor="middle" class="eq">U_M subset U</text>
  <text x="1090" y="697" text-anchor="middle" class="boxText">Select top M pairs by coarse NCC</text>
  <text x="1090" y="732" text-anchor="middle" class="smallText">M configurable (two-stage acceleration)</text>

  <!-- Stage 2 -->
  <rect x="1340" y="500" rx="22" ry="22" width="560" height="360" fill="#ecfeff" class="stroke"/>
  <text x="1620" y="548" text-anchor="middle" class="boxTitle">Stage-2: Refined Evaluation (on U_M)</text>
  <text x="1620" y="588" text-anchor="middle" class="boxText">For each shortlisted pair (i,j):</text>
  <text x="1620" y="628" text-anchor="middle" class="smallText">1) Fine x-search by NCC</text>
  <text x="1620" y="664" text-anchor="middle" class="smallText">2) Optional rigid alignment</text>
  <text x="1620" y="700" text-anchor="middle" class="eq">T(theta, dy, dx)</text>
  <text x="1620" y="737" text-anchor="middle" class="smallText">3) Re-estimate x with T fixed</text>
  <text x="1620" y="776" text-anchor="middle" class="eq">x_ij^* = argmax_x NCC(T_ij*(C_hat_ij(x)), C)</text>
  <text x="1620" y="815" text-anchor="middle" class="smallText">Record: NCC, L2, x_ij^*, (theta,dy,dx)</text>
  <rect x="1366" y="522" rx="10" ry="10" width="150" height="36" fill="#cffafe" stroke="#0f766e" stroke-width="1.8"/>
  <text x="1441" y="546" text-anchor="middle" class="tagText">REFINEMENT</text>

  <!-- Global selection -->
  <rect x="540" y="930" rx="22" ry="22" width="960" height="190" fill="#e2e8f0" class="stroke"/>
  <text x="1020" y="978" text-anchor="middle" class="boxTitle">Global Selection Rule</text>
  <text x="1020" y="1020" text-anchor="middle" class="eq">(i*,j*) = argmax_(i,j in U_M) S_ij</text>
  <text x="1020" y="1060" text-anchor="middle" class="eq">S_ij = NCC(T_ij*(C_hat_ij(x_ij^*)), C)</text>
  <text x="1020" y="1097" text-anchor="middle" class="smallText">Primary rank by NCC; tie-break by minimum L2</text>

  <!-- Outputs -->
  <rect x="560" y="1155" rx="18" ry="18" width="920" height="110" fill="#dcfce7" class="stroke"/>
  <text x="1020" y="1194" text-anchor="middle" class="boxTitle">Outputs</text>
  <text x="1020" y="1229" text-anchor="middle" class="boxText">A* = P_i*,  B* = P_j*,  x*,  Top-k ranked pairs,  (theta*,dy*,dx*),  confidence margin (top1-top2)</text>

  <!-- Order convention side note -->
  <rect x="80" y="930" rx="16" ry="16" width="400" height="190" fill="#fff7ed" class="stroke"/>
  <text x="280" y="976" text-anchor="middle" class="boxTitle">Order Convention</text>
  <text x="280" y="1012" text-anchor="middle" class="smallText">Pair is unordered: {A,B}</text>
  <text x="280" y="1044" text-anchor="middle" class="smallText">x reported in returned order</text>
  <text x="280" y="1076" text-anchor="middle" class="eq">If order swaps: x -> 1 - x</text>

  <!-- Arrows -->
  <path class="arrow" d="M560,295 L690,310"/>
  <path class="arrow" d="M1440,295 L1310,310"/>
  <path class="arrow" d="M1000,440 L1000,575"/>
  <path class="arrow" d="M820,670 L900,670"/>
  <path class="arrow" d="M1280,670 L1340,670"/>
  <path class="arrow" d="M1620,860 L1280,930"/>
  <path class="arrow" d="M1020,1120 L1020,1155"/>
  <path class="dashArrow" d="M480,1028 L540,1028"/>

  <!-- Legend -->
  <rect x="1510" y="940" rx="14" ry="14" width="400" height="180" fill="#f1f5f9" class="stroke"/>
  <text x="1710" y="978" text-anchor="middle" class="boxTitle">Notation</text>
  <text x="1535" y="1014" class="smallText">P_i, P_j : candidate patterns</text>
  <text x="1535" y="1042" class="smallText">C : observed mixed pattern</text>
  <text x="1535" y="1070" class="smallText">C_hat_ij(x) : synthetic mixture model</text>
  <text x="1535" y="1098" class="smallText">NCC : normalized cross-correlation</text>
  <text x="1535" y="1126" class="smallText">L2 : mean squared error (tie-break)</text>
</svg>
