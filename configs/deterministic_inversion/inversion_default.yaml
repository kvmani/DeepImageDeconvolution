# Default config for deterministic (non-ML) mixing-fraction inversion.
#
# Default mode is a synthetic single-pair experiment:
# - Load pure A/B patterns from explicit paths
# - Synthesize a mixed C with known x_true
# - For each enabled metric, optimize x_hat for that metric, then report all metrics at C_hat(x_hat)
data:
  mode: synthetic_pair
  synthetic_pair:
    a_path: data/raw/Double Pattern Data/Good Pattern/Perfect_BCC-1.bmp
    b_path: data/raw/Double Pattern Data/Good Pattern/Perfect_FCC-1.bmp
    x_true: [0.1, 0.3, 0.5]
    noise:
      enabled: true
      gaussian_std: 0.01
      rotation_deg_max: 2.0
      seed: null

deterministic_inversion:
  preprocess:
    auto_crop_to_target: false
    mask:
      enabled: true
      detect_existing: true
      zero_tolerance: 0.0005
      outside_zero_fraction: 0.98
    background_correction:
      enabled: true
      mode: subtractive
      sigma: 21.0
      epsilon: 1.0e-6
    standardize:
      enabled: true
      epsilon: 1.0e-6
    dog:
      enabled: false
      sigma_low: 1.0
      sigma_high: 3.0
    fft_filter:
      enabled: false
      low_cut: 0.0
      high_cut: 1.0
      rolloff: 0.02
  metrics:
    enabled: ["ncc", "ssim", "l2", "l1"]
    # Primary metric is only used for legacy mixed-dir batch mode.
    primary: ncc
  search:
    strategy: exhaustive_grid
    grid_steps: [0.05, 0.01, 0.002]
    refine_window_steps: 4
    exhaustive_step: 0.002
  alignment:
    enabled: false
    translation:
      enabled: true
      max_shift_px: 15
    rotation:
      enabled: true
      search_range_deg: 2.0
      hard_max_deg: 5.0
      step_deg: 0.5
    interpolation_order: 3

output:
  out_dir: outputs/deterministic_inversion
  save_curves: true
  write_html_report: true

debug:
  enabled: false
  seed: 42
  sample_limit: null
  max_pairs: null
