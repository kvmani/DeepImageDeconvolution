# Debug config for deterministic mixing-fraction inversion (candidate-pool synthetic).
data:
  mode: candidate_pool_synthetic
  candidate_pool:
    root_dir: data/raw/Double Pattern Data/Good Pattern
    recursive: false
    max_candidates: 6
    sample_seed: 7
    synthetic_pairs: 3
    synthetic_seed: 7
    x_true: [0.3, 0.6, 0.8]
    noise:
      enabled: true
      gaussian_std: 0.01
      rotation_deg_max: 2.0
      seed: 7

deterministic_inversion:
  preprocess:
    auto_crop_to_target: false
    mask:
      enabled: true
      detect_existing: true
      zero_tolerance: 0.0005
      outside_zero_fraction: 0.98
    background_correction:
      enabled: true
      mode: subtractive
      sigma: 15.0
      epsilon: 1.0e-6
    standardize:
      enabled: true
      epsilon: 1.0e-6
    dog:
      enabled: false
      sigma_low: 1.0
      sigma_high: 3.0
    fft_filter:
      enabled: false
      low_cut: 0.0
      high_cut: 1.0
      rolloff: 0.02
  metrics:
    enabled: ["ncc", "l2", "l1"]
    primary: ncc
  search:
    strategy: exhaustive_grid
    grid_steps: [0.1, 0.02, 0.005]
    refine_window_steps: 3
    exhaustive_step: 0.01
  alignment:
    enabled: false
    translation:
      enabled: true
      max_shift_px: 5
    rotation:
      enabled: true
      search_range_deg: 2.0
      hard_max_deg: 5.0
      step_deg: 1.0
    interpolation_order: 3

output:
  out_dir: outputs/deterministic_inversion_candidate_pool_debug
  save_curves: true
  write_html_report: true

debug:
  enabled: true
  seed: 7
  sample_limit: null
  max_pairs: null
